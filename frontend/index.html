<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Halfspace by Abhijith Varma: explore real football matches, players and tactics, and see where everyone stood at every shot." />
    <meta name="theme-color" content="#EAF1FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C1230" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set the theme before first paint so there is no flash.
      (function () {
        var t;
        try { t = localStorage.getItem("halfspace-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = "light"; // light is the default; a saved choice wins
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <title>The Halfspace by Abhijith Varma</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
