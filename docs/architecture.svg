<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 480" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#1f2328" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1320" height="480" fill="#ffffff"/>

  <text x="44" y="40" font-size="20" font-weight="700" fill="#1f2328">The Halfspace architecture</text>
  <text x="44" y="63" font-size="12.5" fill="#6e7781">Open data → raw cache → canonical DB → derived features → one shared query layer, read by both the API (and React UI) and the agent.</text>

  <!-- row 1: data pipeline -->
  <g filter="url(#shadow)" stroke-width="1.5">
    <rect x="40"  y="90" width="190" height="110" rx="12" fill="#f6f8fa" stroke="#57606a"/>
    <rect x="280" y="90" width="190" height="110" rx="12" fill="#f6f8fa" stroke="#57606a"/>
    <rect x="520" y="90" width="190" height="110" rx="12" fill="#eef2ff" stroke="#3538cd"/>
    <rect x="760" y="90" width="190" height="110" rx="12" fill="#f6f8fa" stroke="#57606a"/>
    <rect x="1000" y="90" width="190" height="110" rx="12" fill="#ecfdf3" stroke="#067647"/>
  </g>

  <g font-size="15.5" font-weight="700" fill="#1f2328" text-anchor="middle">
    <text x="135" y="130">Open data</text>
    <text x="375" y="145">data/raw/</text>
    <text x="615" y="145" fill="#3538cd">SQLite</text>
    <text x="855" y="145">features/</text>
    <text x="1095" y="145" fill="#067647">FastAPI</text>
  </g>
  <g font-size="12" fill="#6e7781" text-anchor="middle">
    <text x="135" y="152">StatsBomb events + 360</text>
    <text x="135" y="168">SkillCorner, IDSSE</text>
    <text x="135" y="184">tracking</text>

    <text x="375" y="168">cached once,</text>
    <text x="375" y="183">gitignored</text>

    <text x="615" y="168" fill="#3538cd">canonical schema</text>
    <text x="615" y="183" fill="#3538cd">halfspace/db.py</text>

    <text x="855" y="168">PPDA, xG-lite, similarity,</text>
    <text x="855" y="183">sequences, pitch data</text>

    <text x="1095" y="168" fill="#067647">23 endpoints</text>
    <text x="1095" y="183" fill="#067647">halfspace/api.py</text>
  </g>

  <g stroke="#6e7781" stroke-width="1.75" marker-end="url(#arrow)">
    <line x1="230" y1="145" x2="278" y2="145"/>
    <line x1="470" y1="145" x2="518" y2="145"/>
    <line x1="710" y1="145" x2="758" y2="145"/>
    <line x1="950" y1="145" x2="998" y2="145"/>
  </g>
  <g font-size="12" fill="#6e7781" text-anchor="middle">
    <text x="254" y="128">fetch</text>
    <text x="494" y="128">ingest</text>
    <text x="734" y="128">derive</text>
    <text x="974" y="128">serve</text>
  </g>

  <!-- row 2: consumers -->
  <g filter="url(#shadow)" stroke-width="1.5">
    <rect x="1000" y="300" width="190" height="90" rx="12" fill="#ecfdf3" stroke="#067647"/>
    <rect x="760" y="300" width="190" height="90" rx="12" fill="#fff8f0" stroke="#9a6700"/>
    <rect x="520" y="300" width="190" height="90" rx="12" fill="#fff8f0" stroke="#9a6700"/>
    <rect x="280" y="300" width="190" height="90" rx="12" fill="#fff8f0" stroke="#9a6700"/>
  </g>
  <g text-anchor="middle">
    <text x="1095" y="338" font-size="14.5" font-weight="700" fill="#067647">React frontend</text>
    <text x="1095" y="358" font-size="12" fill="#067647">Vite + TypeScript, SVG pitch</text>

    <text x="855" y="338" font-size="14.5" font-weight="700" fill="#9a6700">Agent tools</text>
    <text x="855" y="358" font-size="12" fill="#9a6700">13 tools, no SQL of their own</text>

    <text x="615" y="338" font-size="14.5" font-weight="700" fill="#9a6700">Orchestrator</text>
    <text x="615" y="358" font-size="12" fill="#9a6700">provenance + caveat checks</text>

    <text x="375" y="338" font-size="14.5" font-weight="700" fill="#9a6700">LLM client</text>
    <text x="375" y="358" font-size="12" fill="#9a6700">Groq (OpenAI-compatible)</text>
  </g>

  <g stroke="#6e7781" stroke-width="1.75" marker-end="url(#arrow)" marker-start="url(#arrow)">
    <line x1="1095" y1="202" x2="1095" y2="298"/>
    <line x1="855" y1="202" x2="855" y2="298"/>
    <line x1="758" y1="345" x2="712" y2="345"/>
    <line x1="518" y1="345" x2="472" y2="345"/>
  </g>
  <g font-size="12" fill="#6e7781">
    <text x="1105" y="255">HTTP / JSON</text>
    <text x="865" y="255">same lookups the API calls</text>
  </g>

  <text x="40" y="287" font-size="12" font-weight="700" fill="#9a6700">AGENT (CLI today, not yet in the UI)</text>

  <line x1="44" y1="430" x2="1276" y2="430" stroke="#d0d7de" stroke-width="1"/>
  <text x="44" y="452" font-size="12.5" fill="#6e7781">Every layer up to FastAPI is disk-backed. Nothing calls an open-data source on a request path, and the agent has no database access of its own.</text>
</svg>
